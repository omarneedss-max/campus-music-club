<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join | Campus Music Club</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="activities.html">Activities</a>
      <a href="schedule.html">Schedule</a>
      <a href="join.html" aria-current="page">Join</a>
    </nav>
  </header>

  <main>
    <h1>Join the club</h1>
    <p>Practice form. Use sample details and a made-up password.</p>
    <p class="panel" id="demo-result">Demo complete. This form does not save entries.</p>

    <form class="panel" action="join.html#demo-result" method="get">
      <div class="form-grid">
        <label>Full name
          <input class="form-control" type="text" required>
        </label>
        <label>Email
          <input class="form-control" type="email" required>
        </label>
        <label>Demo password
          <input class="form-control" type="password" minlength="4" required>
        </label>
        <label>Years of practice
          <input class="form-control" type="number" min="0" max="40" value="0" name="years">
        </label>
        <label>First visit date
          <input class="form-control" type="date" name="visit" required>
        </label>
        <label>Instrument
          <select class="form-select" name="instrument">
            <option value="keyboard">Keyboard</option>
            <option value="guitar">Guitar</option>
            <option value="vocals">Vocals</option>
          </select>
        </label>
      </div>

      <fieldset>
        <legend>Preferred session</legend>
        <label><input class="form-check-input" type="radio" name="session" value="sunday" checked> Sunday</label>
        <label><input class="form-check-input" type="radio" name="session" value="tuesday"> Tuesday</label>
      </fieldset>

      <label class="choice"><input class="form-check-input" type="checkbox" name="bring-instrument" value="yes"> I can bring an instrument.</label>
      <label class="d-block">What would you like to practice?
        <textarea class="form-control" rows="3"></textarea>
      </label>
      <button class="btn btn-success" type="submit">Submit demo</button>
    </form>
  </main>

  <footer>Campus Music Club · Student mini project</footer>
</body>
</html>
